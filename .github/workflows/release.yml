name: Release

# The last release of the deprecated Node CLI, @zenshilabs/spire. Run it by
# hand; there is no automatic trigger, so a release of anything else in this
# repository can never publish to npm.
#
#   publish    puts out a version whose only job is to say where biga went
#              (apps/cli/src/index.ts)
#   deprecate  marks every version of the package deprecated, with a message
#              pointing at the latest biga release
#
# Both jobs sign in with npm trusted publishing: the package is configured on
# npmjs.com to trust this workflow file and the `release` environment, so there
# is no token to manage. Keep both names as they are.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the final version first. Untick to only deprecate (for a re-run)."
        type: boolean
        default: true

permissions:
  contents: read

env:
  PACKAGE: "@zenshilabs/spire"
  MESSAGE: "Deprecated: Spire is now biga, a standalone Go binary with no Node.js requirement. Install the latest release from https://github.com/biga-sh/cli/releases/latest (server and website: https://github.com/biga-sh/website)"

jobs:
  publish:
    name: Publish the final version
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest

    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, type-check, and build the package
        run: pnpm exec turbo run lint check-types build --filter=@zenshilabs/spire

      - name: Publish
        run: pnpm --filter @zenshilabs/spire publish --no-git-checks --access public --provenance

  deprecate:
    name: Deprecate every version
    needs: publish
    # Runs after a successful publish, or on its own when publishing was skipped.
    if: ${{ !cancelled() && (needs.publish.result == 'success' || needs.publish.result == 'skipped') }}
    runs-on: ubuntu-latest

    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # `npm deprecate` is not one of the commands npm signs in for with OIDC
      # (publish and dist-tag are), so do the exchange by hand, exactly as
      # `npm publish` does: GitHub vouches for this job, the registry trades
      # that for a short-lived token scoped to the package. If the repository
      # has an NPM_TOKEN secret in the `release` environment it is used
      # instead, which is the fallback if the registry refuses the exchanged one.
      - name: Deprecate
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          token="${NPM_TOKEN:-}"
          if [ -z "$token" ]; then
            echo "No NPM_TOKEN secret: exchanging this job's OIDC identity for a short-lived npm token."
            id_token="$(curl -fsS -H "Accept: application/json" \
              -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" | jq -er .value)"
            echo "::add-mask::${id_token}"
            token="$(curl -fsS -X POST -H "Accept: application/json" \
              -H "Authorization: Bearer ${id_token}" \
              "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/@zenshilabs%2fspire" | jq -er .token)"
          fi
          echo "::add-mask::${token}"

          if ! NODE_AUTH_TOKEN="$token" npm deprecate "$PACKAGE" "$MESSAGE"; then
            echo "::error title=npm refused the deprecation::npm trusted publishing may not allow \`npm deprecate\`. Add an npm automation token as the NPM_TOKEN secret in the \`release\` environment and run this workflow again with publish unticked, or run \`npm deprecate\` from an account that owns the package."
            exit 1
          fi

      - name: Show the result
        run: |
          npm view "$PACKAGE" dist-tags.latest
          npm view "$PACKAGE@latest" deprecated --prefer-online
