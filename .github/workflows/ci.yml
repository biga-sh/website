name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      # Run every Node leg even if one fails, so a single version's failure
      # doesn't hide the others.
      fail-fast: false
      matrix:
        # Active/maintenance LTS lines only — no Current/odd (experimental) majors.
        node: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Version comes from the root package.json `packageManager` field, so CI,
      # release, and local dev all resolve to the same pnpm.
      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The web app and the packages it builds from. The build needs a database
      # URL to exist, not to answer: every route that reads it is dynamic.
      - name: Lint, type-check, and build the web app
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: pnpm exec turbo run lint check-types build --filter=web
