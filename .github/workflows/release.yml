name: Release

# The last release of the deprecated Node CLI, @zenshilabs/spire. It publishes
# a version whose only job is to tell people where biga went (see
# apps/cli/src/index.ts). Run it by hand once; there is no automatic trigger,
# so a release of anything else in this repository can never publish to npm.
#
# Publishing uses npm trusted publishing: the package is configured on npmjs.com
# to trust this workflow file and the `release` environment, so there is no
# token to manage. Keep both names as they are.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, type-check, and build the package
        run: pnpm exec turbo run lint check-types build --filter=@zenshilabs/spire

      - name: Publish
        run: pnpm --filter @zenshilabs/spire publish --no-git-checks --access public --provenance
